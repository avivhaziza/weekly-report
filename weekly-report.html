<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>דיווח שבועי</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-low": "#f3f4f5",
            "surface-container-highest": "#e1e3e4",
            "surface-container-lowest": "#ffffff",
            "on-surface-variant": "#434654",
            "on-surface": "#191c1d",
            "primary": "#003d9b",
            "primary-container": "#0052cc",
            "primary-fixed": "#dae2ff",
            "surface-tint": "#0c56d0",
            "error": "#ba1a1a",
            "surface": "#f8f9fa",
            "background": "#f8f9fa",
          },
          fontFamily: { headline: ["Manrope"], body: ["Inter"] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
    .ambient-shadow { box-shadow: 0 4px 32px 0 rgba(25,28,29,0.07); }
    .dark .ambient-shadow { box-shadow: 0 4px 32px 0 rgba(0,0,0,0.3); }
    .glass-panel { backdrop-filter: blur(20px); }
    input:focus, textarea:focus { outline: none; }
    input[type="date"] { color-scheme: light; }
    .dark input[type="date"] { color-scheme: dark; }
    .fade-in { animation: fi 0.18s ease; }
    @keyframes fi { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect } = React;

  /* ─── encode / decode report in URL ─── */
  function encodeReport(data) {
    try {
      // compact keys to shorten URL significantly
      const c = {
        ws: data.weekStart,
        we: data.weekEnd,
        s:  data.status,
        sw: data.statusWhy  || undefined,
        a:  data.areas,
        d:  (data.doneTasks        || []).filter(Boolean),
        ip: (data.inProgressTasks  || []).filter(Boolean),
        bl: (data.blockedTasks     || []).filter(Boolean),
        t:  (data.doneTasks || data.tasks || []).filter(Boolean), // backward compat
        tr: data.trello     || undefined,
        b:  data.blocked === 'yes' ? 1 : 0,
        bw: data.blockedWhy || undefined,
        f:  data.focus,
        fm: data.focusMain  || undefined,
        n:  data.needAviya === 'yes' ? 1 : 0,
        av: data.aviyaText  || undefined,
        pn: data.partnerName,
      };
      Object.keys(c).forEach(k => c[k] === undefined && delete c[k]);
      return btoa(unescape(encodeURIComponent(JSON.stringify(c))));
    } catch { return null; }
  }
  function decodeReport(str) {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(str))));
      // expand compact format
      if ('ws' in d) {
        return {
          weekStart:        d.ws,
          weekEnd:          d.we,
          status:           d.s,
          statusWhy:        d.sw || '',
          areas:            d.a  || [],
          doneTasks:        d.d  || d.t || [],
          inProgressTasks:  d.ip || [],
          blockedTasks:     d.bl || [],
          tasks:            d.t  || d.d || [], // backward compat
          trello:           d.tr || '',
          blocked:          d.b  ? 'yes' : 'no',
          blockedWhy:       d.bw || '',
          focus:            d.f  || [],
          focusMain:        d.fm || '',
          needAviya:        d.n  ? 'yes' : 'no',
          aviyaText:        d.av || '',
          partnerName:      d.pn || '',
        };
      }
      // legacy format (old URLs still work)
      return d;
    } catch { return null; }
  }
  function getHashReport() {
    // support both ?r= (new) and #r= (old/WhatsApp fallback)
    const qp = new URLSearchParams(window.location.search).get('r');
    if (qp) return decodeReport(qp);
    const hm = window.location.hash.match(/[#&]r=([^&]+)/);
    return hm ? decodeReport(hm[1]) : null;
  }
  // auto-detect the base URL for link generation — no config needed when hosted
  function getEffectiveBaseUrl() {
    const stored = LS.getBaseUrl().trim();
    if (stored) return stored;
    const loc = window.location;
    if (loc.protocol === 'https:' || loc.protocol === 'http:') {
      return loc.origin + loc.pathname; // e.g. https://avivhaziza.github.io/weekly-report/weekly-report.html
    }
    return '';
  }

  /* ─── storage ─── */
  const LS = {
    getDark:      () => localStorage.getItem('wr-dark') === '1',
    setDark:      v  => localStorage.setItem('wr-dark', v ? '1' : '0'),
    getPartner:   () => localStorage.getItem('wr-partner') || 'אביה',
    setPartner:   v  => localStorage.setItem('wr-partner', v),
    getBaseUrl:   () => localStorage.getItem('wr-baseurl') || '',
    setBaseUrl:   v  => localStorage.setItem('wr-baseurl', v),
    getReports:   () => JSON.parse(localStorage.getItem('wr-reports') || '[]'),
    addReport:    r  => { const a = LS.getReports(); a.unshift(r); localStorage.setItem('wr-reports', JSON.stringify(a.slice(0,100))); },
    deleteReport: id => { const a = LS.getReports().filter(r=>r.id!==id); localStorage.setItem('wr-reports', JSON.stringify(a)); },
    getProjects:  () => JSON.parse(localStorage.getItem('wr-projects') || '[]'),
    saveProjects: v  => localStorage.setItem('wr-projects', JSON.stringify(v)),
    getTrello:    () => { const c=JSON.parse(localStorage.getItem('wr-trello')||'{}'); if(c.listId&&!c.doneListId)c.doneListId=c.listId; return c; },
    setTrello:    v  => localStorage.setItem('wr-trello', JSON.stringify(v)),
    clearAll:     () => { localStorage.removeItem('wr-reports'); localStorage.removeItem('wr-projects'); },
  };

  /* ─── utils ─── */
  function getWeekRange() {
    const t = new Date(), d = t.getDay();
    const sun = new Date(t); sun.setDate(t.getDate() - d);
    const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
    const fmt = x => x.toISOString().split('T')[0];
    return { start: fmt(sun), end: fmt(sat) };
  }

  /* ─── data ─── */
  const STATUS_OPTS = [
    { v:'excellent', emoji:'🤩', label:'מעולה',  sub:'התקדמות חזקה'  },
    { v:'good',      emoji:'🙂', label:'טוב',    sub:'התקדמות רגילה' },
    { v:'medium',    emoji:'😐', label:'בינוני', sub:'יש עיכובים'    },
    { v:'weak',      emoji:'🙁', label:'חלש',    sub:'מעט התקדמות'  },
  ];
  const AREA_OPTS = [
    { v:'product',   label:'מוצר'    },
    { v:'ops',       label:'תפעול'   },
    { v:'community', label:'קהילה'   },
    { v:'other',     label:'אחר'     },
  ];
  const FOCUS_OPTS = [
    { v:'continue',    label:'המשך פיתוח'  },
    { v:'improve',     label:'שיפור מערכת' },
    { v:'bugs',        label:'סגירת באגים' },
    { v:'new_feature', label:"בניית פיצ'ר" },
    { v:'other',       label:'אחר'          },
  ];
  const PROJECT_STATUSES = [
    { v:'active', label:'פעיל',  color:'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400' },
    { v:'paused', label:'מושהה', color:'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400'         },
    { v:'done',   label:'הושלם', color:'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400'            },
  ];

  /* ─── shared components ─── */
  function SectionCard({ n, title, children }) {
    return (
      <section className="bg-surface-container-low dark:bg-slate-800 p-8 rounded-xl relative overflow-hidden">
        <div className="absolute top-0 right-0 w-full h-1 bg-surface-tint"/>
        <p className="text-xs font-bold text-on-surface-variant dark:text-slate-400 uppercase tracking-widest mb-6">{n}. {title}</p>
        {children}
      </section>
    );
  }

  function UInput({ placeholder, value, onChange, onBlur, maxLength, type='text' }) {
    return (
      <input type={type} value={value} onChange={e=>onChange(e.target.value)} onBlur={onBlur}
        placeholder={placeholder} maxLength={maxLength}
        className="w-full bg-transparent border-0 border-b-2 border-slate-200 dark:border-slate-600 focus:border-primary dark:focus:border-blue-400 py-2 text-on-surface dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm transition-colors"/>
    );
  }

  function StatusRadio({ value, onChange }) {
    return (
      <div className="flex flex-wrap gap-4">
        {STATUS_OPTS.map(o => (
          <div key={o.v} onClick={()=>onChange(o.v)}
            className={`flex-1 min-w-[110px] p-4 text-center rounded-xl border-2 cursor-pointer transition-all select-none
              ${value===o.v ? 'border-primary bg-primary-fixed dark:bg-blue-900/40 dark:border-blue-400' : 'border-transparent bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600'}`}>
            <span className="block text-2xl mb-1">{o.emoji}</span>
            <span className="font-bold text-sm block text-on-surface dark:text-slate-100">{o.label}</span>
            <span className="text-xs text-slate-400 block mt-0.5">{o.sub}</span>
          </div>
        ))}
      </div>
    );
  }

  function AreaCheckboxes({ values, onChange }) {
    const toggle = v => onChange(values.includes(v) ? values.filter(x=>x!==v) : [...values,v]);
    return (
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {AREA_OPTS.map(o => (
          <div key={o.v} onClick={()=>toggle(o.v)}
            className={`flex items-center gap-3 p-4 rounded-xl cursor-pointer transition-colors select-none
              ${values.includes(o.v) ? 'bg-primary-fixed dark:bg-blue-900/40' : 'bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600'}`}>
            <div className={`w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 transition-colors
              ${values.includes(o.v) ? 'border-primary bg-primary dark:border-blue-400 dark:bg-blue-600' : 'border-slate-300 dark:border-slate-500'}`}>
              {values.includes(o.v) && <span className="text-white text-xs leading-none font-bold">✓</span>}
            </div>
            <span className="font-medium text-slate-700 dark:text-slate-200 text-sm">{o.label}</span>
          </div>
        ))}
      </div>
    );
  }

  function FocusChips({ values, onChange }) {
    const toggle = v => onChange(values.includes(v) ? values.filter(x=>x!==v) : [...values,v]);
    return (
      <div className="flex flex-wrap gap-3">
        {FOCUS_OPTS.map(o => (
          <div key={o.v} onClick={()=>toggle(o.v)}
            className={`px-4 py-2 rounded-lg border-2 cursor-pointer transition-all select-none
              ${values.includes(o.v) ? 'border-primary bg-primary-fixed dark:bg-blue-900/40 dark:border-blue-400' : 'bg-white dark:bg-slate-700 border-transparent hover:bg-slate-50 dark:hover:bg-slate-600'}`}>
            <span className="text-sm font-semibold text-on-surface dark:text-slate-100">{o.label}</span>
          </div>
        ))}
      </div>
    );
  }

  function YesNo({ value, onChange, warningOnYes=false }) {
    const opts = [
      { v:'no',  label:'לא', chk:'border-primary dark:border-blue-400' },
      { v:'yes', label:'כן', chk: warningOnYes ? 'border-error dark:border-red-400' : 'border-primary dark:border-blue-400' },
    ];
    return (
      <div className="flex gap-4">
        {opts.map(o=>(
          <div key={o.v} onClick={()=>onChange(o.v)}
            className={`flex items-center gap-3 px-6 py-3 bg-white dark:bg-slate-700 rounded-full border cursor-pointer transition-all select-none ${value===o.v ? o.chk : 'border-transparent'}`}>
            <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center transition-colors
              ${value===o.v ? (warningOnYes&&o.v==='yes'?'border-error dark:border-red-400':'border-primary dark:border-blue-400') : 'border-slate-300 dark:border-slate-500'}`}>
              {value===o.v && <div className={`w-2 h-2 rounded-full ${warningOnYes&&o.v==='yes'?'bg-error':'bg-primary dark:bg-blue-400'}`}/>}
            </div>
            <span className="font-bold text-slate-700 dark:text-slate-200">{o.label}</span>
          </div>
        ))}
      </div>
    );
  }

  function Toggle({ value, onChange }) {
    return (
      <div onClick={()=>onChange(!value)} className="cursor-pointer select-none">
        <div className={`w-12 h-6 rounded-full relative transition-colors ${value?'bg-primary dark:bg-blue-500':'bg-slate-300 dark:bg-slate-600'}`}>
          <div className={`absolute top-1 w-4 h-4 rounded-full bg-white shadow transition-all ${value?'right-1':'right-7'}`}/>
        </div>
      </div>
    );
  }

  function EmptyState({ icon, title, sub }) {
    return (
      <div className="flex flex-col items-center justify-center py-20 text-center">
        <span className="material-symbols-outlined text-5xl text-slate-300 dark:text-slate-600 mb-4">{icon}</span>
        <h3 className="font-bold text-slate-500 dark:text-slate-400 mb-1">{title}</h3>
        <p className="text-sm text-slate-400 dark:text-slate-500 max-w-xs">{sub}</p>
      </div>
    );
  }

  /* ─── Report View (read-only, shown to recipient) ─── */
  function ReportView({ report }) {
    const statusObj = STATUS_OPTS.find(o=>o.v===report.status);
    const areas     = AREA_OPTS.filter(o=>report.areas?.includes(o.v));
    const focusList = FOCUS_OPTS.filter(o=>report.focus?.includes(o.v));
    const doneTasks       = report.doneTasks       || report.tasks || [report.task1,report.task2,report.task3].filter(Boolean);
    const inProgressTasks = report.inProgressTasks || [];
    const blockedTasks    = report.blockedTasks    || [];
    const [copied, setCopied] = useState(false);

    const statusColor = {
      excellent: { bg:'bg-emerald-50 dark:bg-emerald-900/20', text:'text-emerald-700 dark:text-emerald-400', border:'border-emerald-200 dark:border-emerald-800' },
      good:      { bg:'bg-blue-50 dark:bg-blue-900/20',       text:'text-blue-700 dark:text-blue-400',       border:'border-blue-200 dark:border-blue-800'       },
      medium:    { bg:'bg-amber-50 dark:bg-amber-900/20',     text:'text-amber-700 dark:text-amber-400',     border:'border-amber-200 dark:border-amber-800'     },
      weak:      { bg:'bg-red-50 dark:bg-red-900/20',         text:'text-red-700 dark:text-red-400',         border:'border-red-200 dark:border-red-800'         },
    }[report.status] || { bg:'bg-slate-50', text:'text-slate-600', border:'border-slate-200' };

    function Block({ label, children }) {
      return (
        <div className="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 overflow-hidden">
          <div className="px-4 py-2.5 border-b border-slate-50 dark:border-slate-700/60 bg-slate-50/50 dark:bg-slate-800/50">
            <p className="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">{label}</p>
          </div>
          <div className="px-4 py-3">{children}</div>
        </div>
      );
    }

    return (
      <div className="max-w-lg mx-auto space-y-3">

        {/* ── header strip ── */}
        <div className="text-right">
          <p className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">דיווח שבועי</p>
          <h1 className="text-2xl font-extrabold text-on-surface dark:text-slate-100 font-headline">{report.weekStart} — {report.weekEnd}</h1>
        </div>

        {/* ── status — most important, prominent ── */}
        <div className={`flex items-center gap-4 p-4 rounded-xl border-2 ${statusColor.bg} ${statusColor.border}`}>
          <span className="text-4xl shrink-0">{statusObj?.emoji}</span>
          <div className="flex-1 min-w-0">
            <p className={`text-lg font-extrabold font-headline ${statusColor.text}`}>{statusObj?.label}</p>
            {report.statusWhy
              ? <p className="text-sm text-slate-600 dark:text-slate-300 mt-0.5">{report.statusWhy}</p>
              : <p className="text-sm text-slate-400 dark:text-slate-500">{statusObj?.sub}</p>
            }
          </div>
        </div>

        {/* ── 2-col top row: areas + blocked ── */}
        <div className="grid grid-cols-2 gap-3">
          <Block label="תחומי התקדמות">
            {areas.length ? (
              <div className="flex flex-wrap gap-1.5">
                {areas.map(a=>(
                  <span key={a.v} className="px-2.5 py-1 bg-primary-fixed dark:bg-blue-900/40 text-primary dark:text-blue-300 rounded-full text-xs font-bold">{a.label}</span>
                ))}
              </div>
            ) : <span className="text-slate-400 text-sm">—</span>}
          </Block>

          <Block label="תקוע?">
            {report.blocked === 'yes' ? (
              <div>
                <span className="inline-flex items-center gap-1 px-2.5 py-1 bg-red-100 dark:bg-red-900/30 text-error dark:text-red-400 text-xs font-bold rounded-full">
                  <span className="material-symbols-outlined text-sm">warning</span> כן
                </span>
                {report.blockedWhy && <p className="text-sm text-slate-600 dark:text-slate-300 mt-2">{report.blockedWhy}</p>}
              </div>
            ) : (
              <span className="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 text-xs font-bold rounded-full">
                <span className="material-symbols-outlined text-sm">check_circle</span> לא
              </span>
            )}
          </Block>
        </div>

        {/* ── board snapshot ── */}
        <Block label="סטטוס לוח משימות">
          {(doneTasks.length || inProgressTasks.length || blockedTasks.length) ? (
            <div className="space-y-3">
              {doneTasks.length > 0 && (
                <div className="bg-emerald-50 dark:bg-emerald-900/20 rounded-lg p-3 border border-emerald-100 dark:border-emerald-800">
                  <p className="text-xs font-bold text-emerald-700 dark:text-emerald-400 mb-2">✅ הושלם ({doneTasks.length})</p>
                  <ul className="space-y-1">{doneTasks.map((t,i)=><li key={i} className="text-sm text-on-surface dark:text-slate-200">• {t}</li>)}</ul>
                </div>
              )}
              {inProgressTasks.length > 0 && (
                <div className="bg-blue-50 dark:bg-blue-900/20 rounded-lg p-3 border border-blue-100 dark:border-blue-800">
                  <p className="text-xs font-bold text-blue-700 dark:text-blue-400 mb-2">🔄 בתהליך ({inProgressTasks.length})</p>
                  <ul className="space-y-1">{inProgressTasks.map((t,i)=><li key={i} className="text-sm text-on-surface dark:text-slate-200">• {t}</li>)}</ul>
                </div>
              )}
              {blockedTasks.length > 0 && (
                <div className="bg-red-50 dark:bg-red-900/20 rounded-lg p-3 border border-red-100 dark:border-red-800">
                  <p className="text-xs font-bold text-red-700 dark:text-red-400 mb-2">🚧 תקוע ({blockedTasks.length})</p>
                  <ul className="space-y-1">{blockedTasks.map((t,i)=><li key={i} className="text-sm text-on-surface dark:text-slate-200">• {t}</li>)}</ul>
                </div>
              )}
            </div>
          ) : <span className="text-slate-400 text-sm">לא נטענו משימות</span>}
          {report.trello && (
            <a href={report.trello} target="_blank" rel="noopener"
              className="flex items-center gap-2 mt-3 pt-3 border-t border-slate-100 dark:border-slate-700 text-sm text-primary dark:text-blue-400 hover:underline">
              <span className="material-symbols-outlined text-base">open_in_new</span>
              פתח לוח Trello
            </a>
          )}
        </Block>

        {/* ── next week focus ── */}
        <Block label="פוקוס לשבוע הבא">
          {focusList.length ? (
            <div className="space-y-2">
              <div className="flex flex-wrap gap-1.5">
                {focusList.map(f=>(
                  <span key={f.v} className="px-2.5 py-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-full text-xs font-bold">{f.label}</span>
                ))}
              </div>
              {report.focusMain && (
                <p className="text-sm font-semibold text-on-surface dark:text-slate-200 pt-1">{report.focusMain}</p>
              )}
            </div>
          ) : <span className="text-slate-400 text-sm">—</span>}
        </Block>

        {/* ── needs from partner ── always shown when answered ── */}
        {(report.needAviya === 'yes' || report.needAviya === 'no') && (
          report.needAviya === 'yes' ? (
            <div className="bg-amber-50 dark:bg-amber-900/20 border-2 border-amber-200 dark:border-amber-800 rounded-xl p-4">
              <p className="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-widest mb-2 flex items-center gap-1.5">
                <span className="material-symbols-outlined text-base">priority_high</span>
                דרוש מ{report.partnerName||'השותפ/ה'}
              </p>
              <p className="text-sm font-semibold text-on-surface dark:text-slate-200">{report.aviyaText || '?'}</p>
            </div>
          ) : (
            <div className="flex items-center gap-3 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-xl px-4 py-3">
              <span className="material-symbols-outlined text-emerald-600 dark:text-emerald-400 text-xl">check_circle</span>
              <span className="text-sm font-semibold text-emerald-700 dark:text-emerald-400">לא נדרש כלום מ{report.partnerName||'השותפ/ה'} השבוע</span>
            </div>
          )
        )}

        {/* ── copy link ── */}
        <button onClick={()=>{navigator.clipboard.writeText(window.location.href).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);})}}

  /* ─── Form Page ─── */
  function FormPage({ partnerName }) {
    const { start, end } = getWeekRange();
    const [f, setF] = useState({
      weekStart:start, weekEnd:end,
      status:'', statusWhy:'',
      areas:[],
      doneTasks:[], inProgressTasks:[], blockedTasks:[],
      trello:'',
      blocked:'', blockedWhy:'',
      focus:[], focusMain:'',
      needAviya:'', aviyaText:'',
    });
    const set = k => v => setF(p=>({...p,[k]:v}));
    const [sent, setSent]       = useState(false);
    const [saved, setSaved]     = useState(false);
    const [noUrl, setNoUrl]     = useState(false);
    const [importing, setImporting] = useState(false);
    const [importErr, setImportErr] = useState('');

    async function importFromTrello() {
      const cfg = LS.getTrello();
      if (!cfg.key || !cfg.token) {
        setImportErr('הגדר API Key ו-Token בהגדרות קודם');
        setTimeout(()=>setImportErr(''),4000); return;
      }
      setImporting(true); setImportErr('');
      try {
        const q = `key=${cfg.key}&token=${cfg.token}`;

        // helpers
        const isDone    = n => /done|הושלם|finished|complet|ארכיון|archive|closed|סגור/i.test(n);
        const isBlocked = n => /block|תקוע|עצור|stuck|hold/i.test(n);
        const cardAge   = id => new Date(parseInt(id.substring(0,8),16)*1000); // creation date from Trello card ID

        // week boundaries
        const ws = new Date(f.weekStart);
        const we = new Date(f.weekEnd); we.setHours(23,59,59);
        const activeThisWeek = d => { const t=new Date(d); return t>=ws && t<=we; };
        const newThisWeek    = id => { const t=cardAge(id); return t>=ws && t<=we; };

        // 1. all open boards
        const boardsRes = await fetch(`https://api.trello.com/1/members/me/boards?filter=open&fields=name,id&${q}`);
        if (!boardsRes.ok) throw new Error('פרטים שגויים — בדוק Key ו-Token בהגדרות');
        const boards = await boardsRes.json();

        // 2. for each board, fetch lists + cards in parallel
        const boardData = await Promise.all(boards.map(async board => {
          const [lr, cr] = await Promise.all([
            fetch(`https://api.trello.com/1/boards/${board.id}/lists?filter=open&fields=name,id&${q}`),
            fetch(`https://api.trello.com/1/boards/${board.id}/cards?filter=open&fields=name,dateLastActivity,idList,id&${q}`),
          ]);
          return { boardName: board.name, lists: await lr.json(), cards: await cr.json() };
        }));

        // 3. categorize
        const done = [], active = [], blocked = [];
        for (const { boardName, lists, cards } of boardData) {
          const listName = Object.fromEntries(lists.map(l=>[l.id, l.name]));
          const prefix   = boards.length > 1 ? `[${boardName}] ` : '';
          for (const card of cards) {
            const ln  = listName[card.idList] || '';
            const label = (newThisWeek(card.id) ? '🆕 ' : '') + prefix + card.name;
            if (isDone(ln)) {
              if (activeThisWeek(card.dateLastActivity)) done.push(label);
            } else if (isBlocked(ln)) {
              blocked.push(label);
            } else {
              if (activeThisWeek(card.dateLastActivity)) active.push(label);
            }
          }
        }

        setF(p => ({ ...p, doneTasks: done, inProgressTasks: active, blockedTasks: blocked }));
        if (!done.length && !active.length && !blocked.length) {
          setImportErr('אין פעילות השבוע בטרלו'); setTimeout(()=>setImportErr(''),4000);
        }
      } catch(e) { setImportErr(e.message||'שגיאה לא ידועה'); setTimeout(()=>setImportErr(''),4000); }
      setImporting(false);
    }

    useEffect(() => {
      const cfg = LS.getTrello();
      if (cfg.key && cfg.token) importFromTrello();
    }, []);

    function buildReportData() {
      return {
        ...f,
        doneTasks:       f.doneTasks,
        inProgressTasks: f.inProgressTasks,
        blockedTasks:    f.blockedTasks,
        tasks:           f.doneTasks, // backward compat
        partnerName,
        sentAt: new Date().toISOString(),
      };
    }

    function handleSave() {
      const reportData = buildReportData();
      LS.addReport({ id:Date.now(), ...reportData });
      setSaved(true);
      setTimeout(()=>setSaved(false), 2000);
    }

    function handleSend() {
      const baseUrl = getEffectiveBaseUrl();
      const reportData = buildReportData();
      const encoded = encodeReport(reportData);
      const link = baseUrl ? `${baseUrl.replace(/\/$/, '')}?r=${encoded}` : null;
      LS.addReport({ id:Date.now(), ...reportData, ...(link ? {link} : {}) });
      setSent(true);
      setTimeout(()=>setSent(false), 3000);
      if (link) {
        window.open(`https://wa.me/?text=${encodeURIComponent(link)}`, '_blank');
      } else {
        setNoUrl(true);
        setTimeout(()=>setNoUrl(false), 4000);
      }
    }

    const canSend = f.status && f.areas.length > 0;

    return (
      <div className="space-y-8">
        <header className="text-right">
          <h1 className="text-4xl font-extrabold tracking-tight text-on-surface dark:text-slate-100 mb-2 font-headline">דיווח התקדמות שבועי</h1>
          <p className="text-on-surface-variant dark:text-slate-400 text-lg">סכם את פעילות השבוע האחרון ב-3 דקות.</p>
        </header>

        {/* 01 dates */}
        <SectionCard n="01" title="פרטי השבוע">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-end">
            <div className="space-y-2">
              <span className="text-sm font-semibold text-slate-700 dark:text-slate-300">שבוע (מתאריך - עד תאריך)</span>
              <div className="flex items-center gap-4">
                <input type="date" value={f.weekStart} onChange={e=>set('weekStart')(e.target.value)}
                  className="w-full bg-transparent border-0 border-b-2 border-slate-200 dark:border-slate-600 focus:border-primary dark:focus:border-blue-400 text-on-surface dark:text-slate-100 text-sm py-2 transition-colors"/>
                <span className="text-slate-400 shrink-0">עד</span>
                <input type="date" value={f.weekEnd} onChange={e=>set('weekEnd')(e.target.value)}
                  className="w-full bg-transparent border-0 border-b-2 border-slate-200 dark:border-slate-600 focus:border-primary dark:focus:border-blue-400 text-on-surface dark:text-slate-100 text-sm py-2 transition-colors"/>
              </div>
            </div>
          </div>
        </SectionCard>

        {/* 02 status */}
        <SectionCard n="02" title="מצב השבוע">
          <div className="space-y-6">
            <StatusRadio value={f.status} onChange={set('status')}/>
            {f.status && (
              <div className="bg-white dark:bg-slate-700 p-6 rounded-lg ambient-shadow fade-in">
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">למה? (אופציונלי)</label>
                <UInput placeholder="פירוט קצר על תחושת השבוע..." value={f.statusWhy} onChange={set('statusWhy')} maxLength={120}/>
              </div>
            )}
          </div>
        </SectionCard>

        {/* 03 areas */}
        <SectionCard n="03" title="תחומי התקדמות">
          <AreaCheckboxes values={f.areas} onChange={set('areas')}/>
        </SectionCard>

        {/* 04 board snapshot */}
        <SectionCard n="04" title="סטטוס לוח המשימות">
          <div className="space-y-4">
            <div className="flex items-center gap-3 flex-wrap">
              <button onClick={importFromTrello} disabled={importing}
                className="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-primary dark:border-blue-400 text-primary dark:text-blue-400 text-sm font-bold hover:bg-primary-fixed dark:hover:bg-blue-900/30 transition-all disabled:opacity-50">
                <span className={`material-symbols-outlined text-base${importing?' animate-spin':''}`}>refresh</span>
                {importing ? 'מרענן מטרלו...' : 'רענן מ-Trello'}
              </button>
              {importErr && <span className="text-xs text-error dark:text-red-400 fade-in">{importErr}</span>}
            </div>

            {(f.doneTasks.length > 0 || f.inProgressTasks.length > 0 || f.blockedTasks.length > 0) ? (
              <div className="space-y-3 fade-in">
                {f.doneTasks.length > 0 && (

                    <p className="text-xs font-bold text-emerald-700 dark:text-emerald-400 uppercase tracking-widest mb-2">✅ הושלם ({f.doneTasks.length})</p>
                    <ul className="space-y-1">{f.doneTasks.map((t,i)=><li key={i} className="text-sm text-on-surface dark:text-slate-200">• {t}</li>)}</ul>
                  </div>

                {f.inProgressTasks.length > 0 && (

  /* ─── Projects Page ─── */
  function ProjectsPage() {
    const [projects, setProjects] = useState(LS.getProjects());
    const [form, setForm] = useState({ name:'', status:'active', desc:'' });
    const [adding, setAdding] = useState(false);

    function save(updated) { setProjects(updated); LS.saveProjects(updated); }
    function add() {
      if (!form.name.trim()) return;
      save([{ id:Date.now(), ...form }, ...projects]);
      setForm({ name:'', status:'active', desc:'' });
      setAdding(false);
    }
    function cycleStatus(id) {
      const order=['active','paused','done'];
      save(projects.map(p=>p.id===id?{...p,status:order[(order.indexOf(p.status)+1)%3]}:p));
    }
    function remove(id) { save(projects.filter(p=>p.id!==id)); }

    return (
      <div>
        <div className="flex items-center justify-between mb-8">
          <h1 className="text-4xl font-extrabold tracking-tight text-on-surface dark:text-slate-100 font-headline">פרויקטים</h1>
          <button onClick={()=>setAdding(v=>!v)}
            className="flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-blue-800 transition-colors">
            <span className="material-symbols-outlined text-base">{adding?'close':'add'}</span>
            {adding?'ביטול':'פרויקט חדש'}
          </button>
        </div>
        {adding && (
          <div className="bg-surface-container-low dark:bg-slate-800 rounded-xl p-6 mb-6 fade-in space-y-4 relative overflow-hidden">
            <div className="absolute top-0 right-0 w-full h-1 bg-surface-tint"/>
            <div>
              <label className="text-xs font-bold text-on-surface-variant dark:text-slate-400 uppercase tracking-widest mb-2 block">שם הפרויקט</label>
              <UInput placeholder="למשל: אתר לקוח, מודול תשלומים..." value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} maxLength={80}/>
            </div>
            <div>
              <label className="text-xs font-bold text-on-surface-variant dark:text-slate-400 uppercase tracking-widest mb-2 block">סטטוס</label>
              <div className="flex gap-2">
                {PROJECT_STATUSES.map(s=>(
                  <div key={s.v} onClick={()=>setForm(f=>({...f,status:s.v}))}
                    className={`px-3 py-1.5 rounded-full text-xs font-bold cursor-pointer border-2 transition-all ${form.status===s.v?'border-primary dark:border-blue-400':'border-transparent'} ${s.color}`}>
                    {s.label}
                  </div>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs font-bold text-on-surface-variant dark:text-slate-400 uppercase tracking-widest mb-2 block">תיאור (אופציונלי)</label>
              <UInput placeholder="על מה מדובר..." value={form.desc} onChange={v=>setForm(f=>({...f,desc:v}))} maxLength={200}/>
            </div>
            <button onClick={add} className="w-full py-3 bg-primary text-white rounded-xl font-bold text-sm hover:bg-blue-800 transition-colors">הוסף פרויקט</button>
          </div>
        )}
        {projects.length===0 && !adding ? (
          <EmptyState icon="assignment" title="אין פרויקטים עדיין" sub="הוסיפו פרויקט ראשון כדי לעקוב אחר ההתקדמות."/>
        ) : (
          <div className="space-y-3">
            {projects.map(p=>{
              const st=PROJECT_STATUSES.find(s=>s.v===p.status);
              return (
                <div key={p.id} className="bg-surface-container-low dark:bg-slate-800 rounded-xl px-6 py-4 flex items-center gap-4">
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-on-surface dark:text-slate-100 text-sm">{p.name}</p>
                    {p.desc && <p className="text-xs text-slate-400 dark:text-slate-500 mt-0.5 truncate">{p.desc}</p>}
                  </div>
                  <div onClick={()=>cycleStatus(p.id)}
                    className={`px-3 py-1 rounded-full text-xs font-bold cursor-pointer hover:opacity-80 transition-all ${st?.color}`}>
                    {st?.label}
                  </div>
                  <button onClick={()=>remove(p.id)}
                    className="p-1.5 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg text-slate-300 hover:text-error transition-colors">
                    <span className="material-symbols-outlined text-base">delete</span>
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  /* ─── Settings Page ─── */
  function SettingsPage({ dark, toggleDark, partnerName, setPartnerName }) {
    const [nameVal, setNameVal]   = useState(partnerName);
    const [urlVal, setUrlVal]     = useState(() => { const v=LS.getBaseUrl()||getEffectiveBaseUrl(); if(v&&!LS.getBaseUrl())LS.setBaseUrl(v); return v; });
    const [savedName, setSavedName] = useState(false);
    const [savedUrl, setSavedUrl]   = useState(false);
    const [cleared, setCleared]     = useState(false);

    // Trello state
    const trelloCfg = LS.getTrello();
    const [trKey,     setTrKey]     = useState(trelloCfg.key   || '');
    const [trToken,   setTrToken]   = useState(trelloCfg.token || '');
    const [trLoading, setTrLoading] = useState(false);
    const [trErr,     setTrErr]     = useState('');
    const [trSaved,   setTrSaved]   = useState(false);
    const [trBoards,  setTrBoards]  = useState(0); // board count after verify

    async function saveTrello() {
      if (!trKey || !trToken) { setTrErr('הכנס Key ו-Token'); return; }
      setTrLoading(true); setTrErr('');
      try {
        const r = await fetch(`https://api.trello.com/1/members/me/boards?key=${trKey}&token=${trToken}&filter=open&fields=id`);
        if (!r.ok) throw new Error('פרטים שגויים — בדוק Key ו-Token');
        const boards = await r.json();
        LS.setTrello({ key:trKey, token:trToken });
        setTrBoards(boards.length);
        setTrSaved(true); setTimeout(()=>setTrSaved(false), 3000);
      } catch(e) { setTrErr(e.message); }
      setTrLoading(false);
    }

    function saveName(v=nameVal) { LS.setPartner(v); setPartnerName(v); setSavedName(true); setTimeout(()=>setSavedName(false),2000); }
    function saveUrl(v=urlVal)   { LS.setBaseUrl(v); setSavedUrl(true); setTimeout(()=>setSavedUrl(false),2000); }
    function clearAll() { LS.clearAll(); setCleared(true); setTimeout(()=>setCleared(false),2500); }
    // auto-save Trello keys on blur (no verification, just persist)
    function autoSaveTrello() { if(trKey||trToken) LS.setTrello({ ...LS.getTrello(), key:trKey, token:trToken }); }

    return (
      <div className="max-w-lg">
        <h1 className="text-4xl font-extrabold tracking-tight text-on-surface dark:text-slate-100 mb-8 font-headline">הגדרות</h1>
        <div className="space-y-6">

          {/* hosted url */}
          <div className={`rounded-xl relative overflow-hidden ${urlVal ? 'bg-surface-container-low dark:bg-slate-800' : 'bg-amber-50 dark:bg-amber-900/20 border-2 border-amber-200 dark:border-amber-800'}`}>
            <div className={`absolute top-0 right-0 w-full h-1 ${urlVal ? 'bg-surface-tint' : 'bg-amber-400'}`}/>
            <div className="p-6 space-y-3">
              <div>
                <p className="font-bold text-on-surface dark:text-slate-100 text-sm mb-0.5">
                  כתובת אביה לצפייה בדוח
                  {urlVal && <span className="text-emerald-500 mr-2">✓</span>}
                </p>
                <p className="text-xs text-slate-400 dark:text-slate-500">
                  {urlVal
                    ? 'מוגדר — ממלאים פעם אחת בלבד, נשמר אוטומטית.'
                    : 'ממלאים פעם אחת כדי שאביה יוכל לפתוח את הדוח בלחיצה. נשמר אוטומטית.'}
                </p>
              </div>
              <div className="flex gap-2 items-end">
                <div className="flex-1">
                  <UInput
                    placeholder="https://avivhaziza.github.io/weekly-report/weekly-report.html"
                    value={urlVal}
                    onChange={v=>{setUrlVal(v); LS.setBaseUrl(v);}}
                    onBlur={()=>saveUrl()}
                    type="url"/>
                </div>
                {savedUrl && <span className="text-emerald-500 text-sm font-bold pb-1.5 shrink-0">✓ נשמר</span>}
              </div>
              {!urlVal && (
                <p className="text-xs text-amber-700 dark:text-amber-400">
                  הכתובת היא: <span className="font-mono font-bold">https://avivhaziza.github.io/weekly-report/weekly-report.html</span>
                </p>
              )}
            </div>
          </div>

          {/* Trello integration */}
          <div className="bg-surface-container-low dark:bg-slate-800 rounded-xl relative overflow-hidden">
            <div className="absolute top-0 right-0 w-full h-1 bg-blue-500"/>
            <div className="p-6 space-y-4">
              <div>
                <p className="font-bold text-on-surface dark:text-slate-100 text-sm mb-0.5">חיבור Trello</p>
                <p className="text-xs text-slate-400 dark:text-slate-500">המערכת תטען אוטומטית משימות מ<strong>כל הלוחות</strong> שלך ותסווג אותן לפי סטטוס ותאריך פעילות.</p>
              </div>

              <div className="space-y-3">
                <div>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mb-1">API Key</p>
                  <UInput placeholder="הדבק API Key מ-trello.com/app-key" value={trKey}
                    onChange={v=>{setTrKey(v); LS.setTrello({...LS.getTrello(),key:v});}}
                    onBlur={autoSaveTrello}/>
                </div>
                <div>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mb-1">Token</p>
                  <UInput placeholder="הדבק Token" value={trToken}
                    onChange={v=>{setTrToken(v); LS.setTrello({...LS.getTrello(),token:v});}}
                    onBlur={autoSaveTrello}/>
                </div>
              </div>

              {trErr && <p className="text-xs text-error dark:text-red-400 fade-in">{trErr}</p>}
              {trSaved && trBoards > 0 && (
                <div className="bg-emerald-50 dark:bg-emerald-900/20 rounded-lg px-4 py-2.5 text-sm text-emerald-700 dark:text-emerald-400 font-semibold fade-in">
                  ✓ מחובר — נמצאו {trBoards} לוחות
                </div>
              )}

              {(trKey || trToken) && (
                <button onClick={saveTrello} disabled={trLoading}
                  className={`w-full py-2.5 rounded-xl text-sm font-bold transition-colors disabled:opacity-50 ${trSaved?'bg-emerald-500 text-white':'bg-primary text-white hover:bg-blue-800'}`}>
                  {trLoading ? 'מאמת חיבור...' : trSaved ? '✓ נשמר' : 'שמור וחבר Trello'}
                </button>
              )}

              <p className="text-xs text-slate-400 dark:text-slate-500">
                מפתח: <a href="https://trello.com/app-key" target="_blank" className="text-primary dark:text-blue-400 hover:underline">trello.com/app-key</a>
              </p>
            </div>
          </div>

          {/* partner name */}
          <div className="bg-surface-container-low dark:bg-slate-800 rounded-xl p-6 space-y-4">
            <div>
              <p className="font-bold text-on-surface dark:text-slate-100 text-sm mb-0.5">שם השותפ/ה</p>
              <p className="text-xs text-slate-400 dark:text-slate-500">משמש בכפתור השליחה ובשאלה "צריך משהו מ..."</p>
            </div>
            <div className="flex items-end gap-3">
              <div className="flex-1">
                <UInput placeholder="שם השותפ/ה" value={nameVal}
                  onChange={v=>{setNameVal(v); LS.setPartner(v); setPartnerName(v);}}
                  onBlur={()=>saveName()} maxLength={30}/>
              </div>
              {savedName && <span className="text-emerald-500 text-sm font-bold pb-1.5">✓</span>}
            </div>
          </div>

          {/* dark mode */}
          <div className="bg-surface-container-low dark:bg-slate-800 rounded-xl p-6">
            <div className="flex items-center justify-between">
              <div>
                <p className="font-bold text-on-surface dark:text-slate-100 text-sm">מצב לילה</p>
                <p className="text-xs text-slate-400 dark:text-slate-500 mt-0.5">רקע כהה לנוח לעיניים</p>
              </div>
              <div className="flex items-center gap-2">
                <span className="material-symbols-outlined text-slate-400 dark:text-slate-500 text-xl">{dark?'dark_mode':'light_mode'}</span>
                <Toggle value={dark} onChange={toggleDark}/>
              </div>
            </div>
          </div>

          {/* backup / restore */}
          <div className="bg-surface-container-low dark:bg-slate-800 rounded-xl p-6 space-y-4">
            <div>
              <p className="font-bold text-on-surface dark:text-slate-100 text-sm mb-0.5">גיבוי ושחזור דוחות</p>
              <p className="text-xs text-slate-400 dark:text-slate-500">הנתונים נשמרים בדפדפן זה בלבד. ייצא קובץ גיבוי כדי שלא תאבד היסטוריה.</p>
            </div>
            <div className="flex gap-3 flex-wrap">
              <button onClick={()=>{
                const data = { reports: LS.getReports(), projects: LS.getProjects(), exportedAt: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
                const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
                a.download=`weekly-report-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
              }} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-primary text-white text-sm font-bold hover:bg-blue-800 transition-colors">
                <span className="material-symbols-outlined text-base">download</span>
                ייצא גיבוי
              </button>
              <label className="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-600 text-sm font-bold text-slate-600 dark:text-slate-300 hover:border-primary dark:hover:border-blue-400 cursor-pointer transition-colors">
                <span className="material-symbols-outlined text-base">upload</span>
                טען גיבוי
                <input type="file" accept=".json" className="hidden" onChange={e=>{
                  const file = e.target.files[0]; if(!file) return;
                  const reader = new FileReader();
                  reader.onload = ev => {
                    try {
                      const data = JSON.parse(ev.target.result);
                      if(data.reports) localStorage.setItem('wr-reports', JSON.stringify(data.reports));
                      if(data.projects) localStorage.setItem('wr-projects', JSON.stringify(data.projects));
                      alert(`✓ שוחזר — ${data.reports?.length||0} דוחות, ${data.projects?.length||0} פרויקטים`);
                      window.location.reload();
                    } catch { alert('קובץ לא תקין'); }
                  };
                  reader.readAsText(file);
                }}/>
              </label>
            </div>
          </div>

          {/* clear data */}
          <div className="bg-surface-container-low dark:bg-slate-800 rounded-xl p-6">
            <div className="flex items-center justify-between">
              <div>
                <p className="font-bold text-on-surface dark:text-slate-100 text-sm">איפוס נתונים</p>
                <p className="text-xs text-slate-400 dark:text-slate-500 mt-0.5">מחיקת כל הדוחות והפרויקטים</p>
              </div>
              <button onClick={clearAll}
                className={`px-4 py-2 rounded-xl text-sm font-bold transition-colors ${cleared?'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400':'bg-red-50 dark:bg-red-900/20 text-error dark:text-red-400 hover:bg-red-100'}`}>
                {cleared?'✓ נמחק':'אפס הכל'}
              </button>
            </div>
          </div>

          <p className="text-xs text-center text-slate-400 dark:text-slate-600 pt-2">כל הנתונים נשמרים מקומית בדפדפן בלבד.</p>
        </div>
      </div>
    );
  }

  /* ─── nav items ─── */
  const NAV = [
    { id:'dashboard', icon:'bar_chart',   label:'לוח בקרה' },
    { id:'form',      icon:'description', label:'דיווח'     },
    { id:'projects',  icon:'assignment',  label:'פרויקטים' },
    { id:'settings',  icon:'settings',    label:'הגדרות'   },
  ];

  /* ─── App ─── */
  function App() {
    const hashReport = getHashReport();
    const [dark, setDark]               = useState(LS.getDark());
    const [page, setPage]               = useState('form');
    const [partnerName, setPartnerName] = useState(LS.getPartner());

    function toggleDark() { const n=!dark; setDark(n); LS.setDark(n); }
    function navigate(p)  { setPage(p); window.scrollTo({top:0,behavior:'smooth'}); }

    /* ── recipient view (hash contains report) ── */
    if (hashReport) {
      return (
        <div className={dark?'dark':''}>
          <div className="min-h-screen bg-surface dark:bg-slate-950 py-10 px-4 transition-colors">
            <div className="max-w-xl mx-auto mb-6 flex items-center justify-between">
              <button onClick={toggleDark}
                className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                <span className="material-symbols-outlined text-slate-500 dark:text-slate-400">{dark?'light_mode':'dark_mode'}</span>
              </button>
              <div className="flex items-center gap-2">
                <span className="material-symbols-outlined text-primary dark:text-blue-400">description</span>
                <span className="font-bold text-slate-700 dark:text-slate-200 font-headline">דיווח שבועי</span>
              </div>
            </div>
            <ReportView report={hashReport}/>
          </div>
        </div>
      );
    }

    /* ── sender view (normal app) ── */
    return (
      <div className={dark?'dark':''}>
        <div className="min-h-screen flex flex-col bg-surface dark:bg-slate-950 text-on-surface dark:text-slate-100 transition-colors">

          {/* TopAppBar */}
          <nav className="fixed top-0 w-full z-50 glass-panel bg-white/80 dark:bg-slate-900/80 shadow-sm dark:shadow-slate-900/50 border-b border-transparent dark:border-slate-800">
            <div className="flex flex-row-reverse justify-between items-center px-6 py-4">
              <div className="flex items-center gap-3">
                <span className="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100 font-headline">דיווח שבועי</span>
                <span className="material-symbols-outlined text-blue-700 dark:text-blue-400">description</span>
              </div>
              <div className="flex items-center gap-3">
                <div className="hidden md:flex flex-row-reverse gap-2 items-center">
                  {NAV.map(item=>(
                    <button key={item.id} onClick={()=>navigate(item.id)}
                      className={`px-4 py-1.5 rounded-lg font-medium text-sm transition-colors
                        ${page===item.id ? 'text-blue-700 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100/50 dark:hover:bg-slate-800'}`}>
                      {item.label}
                    </button>
                  ))}
                </div>
                <button onClick={toggleDark}
                  className="p-2 hover:bg-slate-100/50 dark:hover:bg-slate-800 rounded-full transition-colors">
                  <span className="material-symbols-outlined text-slate-600 dark:text-slate-400">{dark?'light_mode':'dark_mode'}</span>
                </button>
              </div>
            </div>
          </nav>

          {/* Sidebar */}
          <aside className="hidden lg:flex fixed right-0 top-0 h-full w-64 bg-slate-50 dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 flex-col items-end text-right pt-24 z-40">
            <div className="px-6 mb-8 w-full">
              <h2 className="text-lg font-black text-blue-800 dark:text-blue-400 font-headline">השותפות</h2>
              <p className="text-xs text-slate-500 dark:text-slate-500 font-bold uppercase tracking-wider">ניהול שוטף</p>
            </div>
            <nav className="w-full flex flex-col">
              {NAV.map(item=>(
                <button key={item.id} onClick={()=>navigate(item.id)}
                  className={`flex flex-row-reverse items-center gap-4 px-6 py-4 transition-all w-full text-right
                    ${page===item.id
                      ? 'text-blue-700 dark:text-blue-400 font-bold border-r-4 border-blue-700 dark:border-blue-400 bg-blue-50/50 dark:bg-blue-900/20'
                      : 'text-slate-600 dark:text-slate-400 hover:bg-blue-50 dark:hover:bg-slate-800'}`}>
                  <span className="material-symbols-outlined">{item.icon}</span>
                  <span className="font-bold text-sm tracking-wide">{item.label}</span>
                </button>
              ))}
            </nav>
          </aside>

          {/* Content */}
          <main className="flex-1 lg:pr-64 pt-24 pb-24 md:pb-16 px-4 md:px-8 max-w-5xl mx-auto w-full">
            {page==='form'      && <FormPage partnerName={partnerName}/>}
            {page==='dashboard' && <DashboardPage/>}
            {page==='projects'  && <ProjectsPage/>}
            {page==='settings'  && <SettingsPage dark={dark} toggleDark={toggleDark} partnerName={partnerName} setPartnerName={setPartnerName}/>}
          </main>

          {/* Footer */}
          <footer className="w-full border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 lg:pr-64">
            <div className="flex flex-row-reverse justify-between items-center px-8 py-5 max-w-5xl mx-auto">
              <span className="text-sm font-bold text-slate-400 dark:text-slate-600">דוח שבועי © 2026</span>
              <span className="text-xs text-slate-300 dark:text-slate-700">נתונים נשמרים מקומית</span>
            </div>
          </footer>

          {/* Mobile nav */}
          <nav className="md:hidden fixed bottom-0 left-0 w-full glass-panel bg-white/90 dark:bg-slate-900/90 border-t border-slate-100 dark:border-slate-800 flex justify-around items-center py-2 px-2 z-50">
            {NAV.map(item=>(
              <button key={item.id} onClick={()=>navigate(item.id)}
                className={`flex flex-col items-center gap-1 px-3 py-1.5 rounded-xl transition-colors
                  ${page===item.id ? 'text-blue-700 dark:text-blue-400' : 'text-slate-400 dark:text-slate-500'}`}>
                <span className="material-symbols-outlined text-xl" style={page===item.id?{fontVariationSettings:"'FILL' 1"}:{}}>{item.icon}</span>
                <span className="text-[10px] font-bold">{item.label}</span>
              </button>
            ))}
          </nav>

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
